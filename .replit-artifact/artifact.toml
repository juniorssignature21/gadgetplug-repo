kind = "web"
previewPath = "/"
title = "The Gentlemen Series"
description = "A polished Nigerian gadget marketplace where customers browse devices, compare installment plans, apply for a gadget, and track simulated payments."
version = "1.0.0"
id = "artifacts/gentlemen-series"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21824

[services.development]
run = "pnpm --filter @workspace/gentlemen-series run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gentlemen-series", "run", "build" ]
serve = "static"
publicDir = "artifacts/gentlemen-series/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21824"
BASE_PATH = "/"
